name: Unpack Android project
on:
  push:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Extract project into repository root
        run: |
          mkdir -p /tmp/kira-unpack
          unzip -q Kira-Android-2D.zip -d /tmp/kira-unpack
          test -d /tmp/kira-unpack/Kira-Android
          cp -a /tmp/kira-unpack/Kira-Android/. .
          rm -rf /tmp/kira-unpack Kira-Android-2D.zip
      - name: Commit extracted Android project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Add extracted Android 2D project"
          git push origin HEAD:main
